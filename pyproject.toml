[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot"
version = "0.1.0"
description = "QQ 大模型聊天机器人：OneBot v11 接入，任意 OpenAI 兼容模型，带人设、记忆与插件"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "puppetfreedom895-ui" }]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
phone = ["uiautomator2>=3.0"]

[project.scripts]
robot = "robot.cli:main"
phone-mcp = "robot.mcp_phone.server:main"

[tool.hatch.build.targets.wheel]
packages = ["robot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
